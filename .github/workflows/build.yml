name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      light:
        description: 'Light run: ubuntu × Node 24 only (skips the macOS/Windows cells)'
        type: boolean
        default: true

concurrency:
  # Each push to `main` gets its own group, so every commit there is built and published.
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  # Deciding the matrix in one cheap ubuntu job keeps the choice visible in the
  # logs, instead of folding it into an expression nobody can read.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - name: Pick the matrix
        id: pick
        run: |
          if [ "${{ inputs.light }}" = "true" ]; then
            # A manual light run: one cell, for iterating without touching macOS.
            echo 'matrix={"include":[{"os":"ubuntu-latest","node-version":24}]}' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"include":[{"os":"ubuntu-latest","node-version":24},{"os":"ubuntu-latest","node-version":26},{"os":"windows-latest","node-version":24},{"os":"windows-latest","node-version":26},{"os":"macos-latest","node-version":24},{"os":"macos-latest","node-version":26}]}' >> "$GITHUB_OUTPUT"
          fi
      - name: Show the choice
        run: echo "matrix=${{ steps.pick.outputs.matrix }}"

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26
      - name: Install Corepack
        run: npm install -g --force corepack@latest
      - name: Enable Corepack
        run: corepack enable
      - name: Restore yarn cache
        uses: actions/cache@v4
        with:
          path: ~/.yarn/berry/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-
      - name: Install
        run: yarn --no-immutable
      - name: Lint
        run: yarn lint

  build:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Check out
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26
      - name: Install Corepack
        run: npm install -g --force corepack@latest
      - name: Enable Corepack
        run: corepack enable
      - name: Restore yarn cache
        uses: actions/cache@v4
        with:
          path: ~/.yarn/berry/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-
      - name: Install
        run: yarn --no-immutable
      - name: Build (1)
        run: yarn build core
      - name: Build (2)
        run: yarn build
      - name: Publish
        if: >-
          github.event_name == 'push' &&
          contains(fromJson('["refs/heads/main"]'), github.ref)
        run: |-
          yarn config set npmPublishProvenance true
          yarn config set npmRegistryServer https://registry.npmjs.org/
          yarn yakumo publish

  test:
    needs: plan
    runs-on: ${{ matrix.os }}

    strategy:
      # A red cell is evidence, not noise: the whole matrix is kept on purpose.
      # `fail-fast: true` would cancel the sibling cells and throw away the
      # cross-platform comparison this project cites.
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}

    steps:
      - name: Check out
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install Corepack
        run: npm install -g --force corepack@latest
      - name: Enable Corepack
        run: corepack enable
      - name: Restore yarn cache
        uses: actions/cache@v4
        with:
          path: ~/.yarn/berry/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-
      - name: Install
        run: yarn --no-immutable
      - name: Unit Test
        run: yarn test:json
