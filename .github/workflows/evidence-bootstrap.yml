name: Evidence — Bootstrap Statistics (30 Runs)

on:
  workflow_dispatch:
  push:
    branches: [probe-262-rebuild]
    paths:
      - '.github/workflows/evidence-bootstrap.yml'
      - 'scripts/bootstrap_analysis.py'
      - 'scripts/fetch_job_logs.py'

concurrency:
  group: evidence-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    name: Download logs & Bootstrap 10k resamples
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # 仅在 fork 仓库运行，防止误触发上游
    if: github.repository_owner == 'XuJianrui'
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          pip install -q scipy numpy pandas tqdm requests
          pip list | grep -E "scipy|numpy|pandas|tqdm|requests"

      - name: Download 30 run job logs
        id: download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/fetch_job_logs.py \
            --repo "${{ github.repository }}" \
            --out evidence/statistical/raw_logs \
            --runs "41319092304,41351782962,41401117722,41435898951,41445271315,41445289431,41446144427,41446196426,41448886215,41560142581,41572883676,41736747356,41737956074,41746559054,41753424524,41753599923,41753701139,41754609497,41756237186"

      - name: Bootstrap analysis (10k resamples)
        id: analyze
        run: |
          set -euo pipefail
          echo "Input directory contents:"
          ls -la evidence/statistical/raw_logs/ || echo "empty"
          python3 scripts/bootstrap_analysis.py \
            --input-dir evidence/statistical/raw_logs \
            --output-dir evidence/statistical \
            --resamples 10000 \
            --confidence 0.95 \
            2>&1 | tee bootstrap_output.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-results
          path: |
            evidence/statistical/
            bootstrap_output.txt
          retention-days: 30

      - name: Commit the small results (not the raw logs)
        if: always()
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # raw logs stay in the artifact; only the derived tables go in the repo
          git add -f evidence/statistical/summary.json \
                     evidence/statistical/readings_summary.csv \
                     evidence/statistical/digest.md \
                     evidence/statistical/raw_logs/manifest.json 2>/dev/null
          git commit -m "evidence(stats): bootstrap summary from run ${{ github.run_id }}"
          git pull --rebase --quiet
          git push

      - name: Summary
        if: always()
        run: |
          echo "## Bootstrap statistics" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f evidence/statistical/digest.md ]; then
            cat evidence/statistical/digest.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No digest.md produced." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          python3 - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, pathlib
          p = pathlib.Path("evidence/statistical/summary.json")
          if not p.exists():
              print("No summary.json produced.")
          else:
              d = json.loads(p.read_text())
              m = d["metadata"]
              print(f"logs `{m['log_files']}` · with readings `{m['logs_with_readings']}` "
                    f"· per-job layer rows `{m['per_job_layer_rows']}` "
                    f"· resamples `{m['bootstrap_resamples']}`")
              print("")
              print("| ratio | n | effect vs 1.0 | power | Holm p | Holm thr | significant |")
              print("| :--- | :-- | :-- | :-- | :-- | :-- | :-- |")
              for k, v in d["ratios"].items():
                  h = d["multiple_comparison"].get(k, {})
                  print(f"| {k} | {v['count']} | {v['effect_size_vs_1.0']:.3f} | "
                        f"{(v['power_vs_1.0'] or 0):.2f} | {h.get('p_value', 0):.3g} | "
                        f"{h.get('holm_threshold', 0):.3g} | {h.get('significant_after_holm')} |")
              print("")
              print(m["note"])
          PY