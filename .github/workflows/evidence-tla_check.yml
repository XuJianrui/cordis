name: Evidence — TLA+ Model Check (TLC)

on:
  workflow_dispatch:
  push:
    branches: [probe-262-rebuild]
    paths:
      - 'evidence/tla/**'
      - '.github/workflows/evidence-tla_check.yml'

concurrency:
  group: evidence-tla-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tlc:
    name: TLC — three configs, each with an expected verdict
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # fork only — never run in the upstream repository
    if: github.repository_owner == 'XuJianrui'
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Download tla2tools.jar (TLC)
        id: jar
        run: |
          set -euo pipefail
          URL="https://github.com/tlaplus/tlaplus/releases/latest/download/tla2tools.jar"
          curl -LfsS "$URL" -o /tmp/tla2tools.jar
          ls -la /tmp/tla2tools.jar
          java -cp /tmp/tla2tools.jar tlc2.TLC -help 2>&1 | head -3 || true

      - name: Run the three configs and assert the expected verdict
        id: check
        run: |
          # GitHub runs bash with -e; the runner script decides pass/fail itself.
          set +e
          cd evidence/tla
          TLA_JAR=/tmp/tla2tools.jar bash run-tlc.sh 2>&1 | tee ../../tlc_output.txt
          rc=${PIPESTATUS[0]}
          echo "run-tlc exit=$rc"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit $rc

      - name: Collect machine-readable summary
        if: always()
        run: |
          set +e
          mkdir -p evidence/tla_results
          cp tlc_output.txt evidence/tla_results/ 2>/dev/null || true
          python3 - <<'PY'
          import json, os, re, pathlib, datetime
          out_dir = pathlib.Path("evidence/tla_results")
          out_dir.mkdir(parents=True, exist_ok=True)
          txt = ""
          p = pathlib.Path("tlc_output.txt")
          if p.exists():
              txt = p.read_text(errors="replace")

          cases = {}
          cur = None
          for line in txt.splitlines():
              m = re.match(r"CASE (\S+)\s+\(expect: (\w+)\)", line.strip())
              if m:
                  cur = m.group(1)
                  cases[cur] = {"expected": m.group(2)}
                  continue
              if cur:
                  m2 = re.search(r"verdict: (\w+)", line)
                  if m2:
                      cases[cur]["verdict"] = m2.group(1)
                  if "RESULT: PASS" in line:
                      cases[cur]["result"] = "PASS"
                  if "RESULT: FAIL" in line:
                      cases[cur]["result"] = "FAIL"

          summary_line = ""
          for line in txt.splitlines():
              if line.startswith("TLC: "):
                  summary_line = line.strip()

          out = {
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "sha": os.environ.get("GITHUB_SHA"),
              "timestamp": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "tool": "tlc",
              "bounds": {"MaxPending": 3, "MaxWrites": 3},
              "cases": cases,
              "summary": summary_line,
              "all_matched": summary_line.startswith("TLC: all 3 cases matched"),
          }
          rid = out["run_id"] or "local"
          (out_dir / f"run_{rid}.json").write_text(json.dumps(out, indent=2))
          print(json.dumps(out, indent=2))
          PY

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tla-results
          path: evidence/tla_results/
          retention-days: 30

      - name: Commit results
        if: always()
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add evidence/tla_results/
          git commit -m "evidence(tla): TLC verdicts from run ${{ github.run_id }}"
          git pull --rebase --quiet
          git push

      - name: Summary
        if: always()
        run: |
          echo "## TLA+ model check (TLC)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          for p in sorted(pathlib.Path("evidence/tla_results").glob("run_*.json")):
              d = json.loads(p.read_text())
              print(f"**{d['summary'] or 'no summary'}**")
              print("")
              print("| config | expected | verdict | result |")
              print("| :--- | :--- | :--- | :--- |")
              for k, v in d["cases"].items():
                  print(f"| {k} | {v.get('expected')} | {v.get('verdict')} | {v.get('result')} |")
              print("")
              print(f"run `{d['run_id']}` · sha `{str(d['sha'])[:7]}` · bounds MaxPending=3, MaxWrites=3")
              break
          PY
