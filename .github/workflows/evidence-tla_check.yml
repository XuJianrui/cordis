name: Evidence — TLA+ Model Check (Apalache)

on:
  workflow_dispatch:
  push:
    branches: [probe-262-rebuild]
    paths:
      - 'evidence/tla/**'
      - '.github/workflows/evidence-tla_check.yml'

concurrency:
  group: evidence-tla-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apalache:
    name: Apalache bounded model check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # fork only — never run in the upstream repository
    if: github.repository_owner == 'XuJianrui'
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK (Apalache needs Java 17+)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Download Apalache
        id: apalache
        run: |
          set -euo pipefail
          VERSION="0.62.4"
          URL="https://github.com/informalsystems/apalache/releases/download/v${VERSION}/apalache-${VERSION}.tgz"
          echo "Downloading $URL"
          curl -LfsS "$URL" -o /tmp/apalache.tgz
          ls -la /tmp/apalache.tgz
          mkdir -p /tmp/apalache
          tar -xzf /tmp/apalache.tgz -C /tmp/apalache
          APALACHE_BIN=$(find /tmp/apalache -type f -name 'apalache-mc' -o -type f -name 'apalache' | head -1)
          if [ -z "$APALACHE_BIN" ]; then echo "::error::apalache binary not found in archive"; find /tmp/apalache -maxdepth 3 | head -40; exit 1; fi
          chmod +x "$APALACHE_BIN"
          echo "APALACHE=$APALACHE_BIN" >> "$GITHUB_OUTPUT"
          echo "found: $APALACHE_BIN"
          "$APALACHE_BIN" version || true

      - name: Check the three configurations
        id: check
        run: |
          set -uo pipefail
          BIN="${{ steps.apalache.outputs.APALACHE }}"
          mkdir -p evidence/tla_results/raw

          # Each config isolates one property. A config is EXPECTED to fail when
          # it asks a question the contract does not promise; the verdict table
          # below records what each one actually said.
          declare -A EXPECT
          EXPECT[MC-stale]="violated"
          EXPECT[MC-cleared]="holds"
          EXPECT[MC-uncleared]="violated"

          : > evidence/tla_results/verdicts.txt
          overall=0
          for cfg in MC-stale MC-cleared MC-uncleared; do
            echo "==================== $cfg ===================="
            OUT="evidence/tla_results/raw/${cfg}.txt"
            ( cd evidence/tla && "$BIN" check \
                --config="${cfg}.cfg" \
                --length=20 \
                ctxfs.tla ) > "$OUT" 2>&1
            rc=$?
            echo "exit=$rc"
            tail -25 "$OUT"

            # Apalache exit codes: 0 = no error, 12 = invariant violation,
            # 19/20 = other check outcomes. Classify from the text to stay robust.
            if grep -qE 'violat|Invariant .* is violated|Counterexample' "$OUT"; then
              verdict="violated"
            elif grep -qE 'No error|checks passed|The outcome is: OK' "$OUT"; then
              verdict="holds"
            elif [ $rc -eq 0 ]; then
              verdict="holds"
            else
              verdict="error(exit=$rc)"
            fi

            echo "$cfg|$verdict|expected=${EXPECT[$cfg]}" >> evidence/tla_results/verdicts.txt
            echo "$cfg -> $verdict (expected ${EXPECT[$cfg]})"

            # A mismatch is signal, not a crash: record it and keep going.
            if [ "$verdict" != "${EXPECT[$cfg]}" ]; then
              echo "::warning::$cfg gave '$verdict', expected '${EXPECT[$cfg]}'"
            fi
          done

          echo "----- verdict table -----"
          cat evidence/tla_results/verdicts.txt
          exit 0

      - name: Write result JSON
        if: always()
        id: extract
        run: |
          set -uo pipefail
          python3 - <<'PY'
          import json, os, pathlib, datetime, re
          root = pathlib.Path("evidence/tla_results")
          verdicts = {}
          vf = root / "verdicts.txt"
          if vf.exists():
              for line in vf.read_text().splitlines():
                  parts = line.split("|")
                  if len(parts) == 3:
                      verdicts[parts[0]] = {"verdict": parts[1], "expected": parts[2].split("=",1)[-1]}
          # pull state counts from raw logs if present
          counts = {}
          for p in (root / "raw").glob("*.txt"):
              txt = p.read_text(errors="replace")
              m = re.findall(r"([0-9]+) states found", txt) or re.findall(r"states: ([0-9]+)", txt)
              counts[p.stem] = m[-1] if m else None
          run_id = os.environ.get("GITHUB_RUN_ID", "local")
          sha = os.environ.get("GITHUB_SHA", "")
          out = {
              "run_id": run_id,
              "sha": sha,
              "timestamp": datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"),
              "tool": "apalache",
              "version": "0.62.4",
              "bounds": {"max_pending": 3, "max_writes": 3, "length": 20},
              "verdicts": verdicts,
              "state_counts": counts,
          }
          (root / f"run_{run_id}.json").write_text(json.dumps(out, indent=2))
          print(json.dumps(out, indent=2))
          PY

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tla-results
          path: evidence/tla_results/
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          echo "## TLA+ Model Check (Apalache)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f evidence/tla_results/verdicts.txt ]; then
            echo "| config | verdict | expected |" >> "$GITHUB_STEP_SUMMARY"
            echo "| :--- | :--- | :--- |" >> "$GITHUB_STEP_SUMMARY"
            while IFS='|' read -r cfg verdict exp; do
              echo "| $cfg | $verdict | ${exp#expected=} |" >> "$GITHUB_STEP_SUMMARY"
            done < evidence/tla_results/verdicts.txt
          else
            echo "No verdicts produced." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Bounds: MaxPending=3, MaxWrites=3, --length=20." >> "$GITHUB_STEP_SUMMARY"
          echo "A violated verdict is the expected answer for the two configs that" >> "$GITHUB_STEP_SUMMARY"
          echo "ask the contract to promise something it does not promise." >> "$GITHUB_STEP_SUMMARY"
